<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ミニバス乗車管理</title>

  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
      max-width: 500px;
      margin: auto;
    }

    input, button {
      font-size: 18px;
      padding: 12px;
      margin: 6px 0;
      width: 100%;
      box-sizing: border-box;
    }

    button {
      cursor: pointer;
    }

    #status {
      margin-top: 15px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <h2>🏀 ミニバス乗車管理</h2>

<h3>🚐 乗車メンバーを選択</h3>
<label>
  📅 乗車日：
  <input type="date" id="tripDate">
</label>

<div id="memberList">

  <label><input type="checkbox" value="西濱"> 西濱</label>
  <label><input type="checkbox" value="小澤"> 小澤</label>
  <label><input type="checkbox" value="竹内"> 竹内</label>
  <label><input type="checkbox" value="粉川"> 粉川</label>
  <label><input type="checkbox" value="山口"> 山口</label>
  <label><input type="checkbox" value="藤本"> 藤本</label>
  <label><input type="checkbox" value="萩"> 萩</label>
  <label><input type="checkbox" value="中田"> 中田</label>
  <label><input type="checkbox" value="西田"> 西田</label>
  <label><input type="checkbox" value="伊丹"> 伊丹</label>
  <label><input type="checkbox" value="高木"> 高木</label>
  <label><input type="checkbox" value="鈴木"> 鈴木</label>
  <label><input type="checkbox" value="加藤"> 加藤</label>
  <label><input type="checkbox" value="長沼"> 長沼</label>
  <label><input type="checkbox" value="舘"> 舘</label>

</div>

<button id="saveButton">
  🚐 選択したメンバーを登録
</button>

<p id="status">準備中……</p>
<hr>

<h3>🚐 乗車履歴</h3>

<div id="tripHistory">
  読み込み中……
</div>


<button id="saveButton">
  🚐 乗車登録
</button>

  <p id="status">Firebase接続確認中……</p>


<script type="module">

import { initializeApp } from
  "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

import {
  initializeFirestore,
  collection,
  addDoc,
  serverTimestamp,
  getDocs
} from
  "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyBRYKiCM_T3gl3dOIGDm5YIqUyJe-5ig8A",
  authDomain: "minibusdanin.firebaseapp.com",
  projectId: "minibusdanin",
  storageBucket: "minibusdanin.firebasestorage.app",
  messagingSenderId: "1093555104011",
  appId: "1:1093555104011:web:935cef97dd4bfee8615a0e",
  measurementId: "G-XFSJQRLHQ2"
};


const app = initializeApp(firebaseConfig);

const db = initializeFirestore(app, {}, "default");


const status = document.getElementById("status");
const saveButton = document.getElementById("saveButton");

saveButton.addEventListener("click", async () => {

  const tripDate = document.getElementById("tripDate").value;
  if (!tripDate) {
  status.textContent =
    "⚠️ 乗車日を選択してください。";
  return;
}
  const checkedMembers = Array.from(
    document.querySelectorAll(
      '#memberList input[type="checkbox"]:checked'
    )
  );

  if (checkedMembers.length === 0) {
    status.textContent =
      "⚠️ 乗車するメンバーを選択してください。";
    return;
  }

  try {

    for (const checkbox of checkedMembers) {

      await addDoc(
        collection(db, "trips"),
        {
          memberName: checkbox.value,
tripDate: tripDate,
createdAt: serverTimestamp()
        }
      );

    }

    status.textContent =
      "✅ " +
      checkedMembers.length +
      "人の乗車記録を保存しました！";

    checkedMembers.forEach(checkbox => {
      checkbox.checked = false;
    });

  } catch (error) {

    console.error(error);

    status.textContent =
      "❌ 保存失敗: " +
      error.code +
      " / " +
      error.message;

  }

});
async function loadTripHistory() {

  const history = document.getElementById("tripHistory");

  try {

    const snapshot = await getDocs(
      collection(db, "trips")
    );

    if (snapshot.empty) {
      history.textContent = "まだ乗車記録がありません。";
      return;
    }

    history.innerHTML = "";

    snapshot.forEach((doc) => {

      const data = doc.data();

      const item = document.createElement("div");

      item.textContent =
        "🚐 " + (data.memberName || "名前なし");

      item.style.padding = "8px 0";
      item.style.borderBottom = "1px solid #ddd";

      history.appendChild(item);

    });

  } catch (error) {

    console.error(error);

    history.textContent =
      "❌ 履歴の読み込みに失敗しました。";

  }

}

loadTripHistory();
</script>

</body>
</html>
