<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<title>🏀 ミニバス 配車管理 V4</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Noto Sans JP",sans-serif;
  background:#f5f7fb;
  color:#222;
}

header{
  background:#111827;
  color:white;
  padding:18px 16px 14px;
  position:sticky;
  top:0;
  z-index:20;
}

header h1{
  margin:0;
  font-size:21px;
}

.sync{
  margin-top:6px;
  font-size:12px;
  opacity:.9;
}

.sync.online{
  color:#86efac;
}

.sync.offline{
  color:#fca5a5;
}

.container{
  max-width:760px;
  margin:auto;
  padding:12px;
  padding-bottom:80px;
}

.tabs{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:6px;
  margin-bottom:12px;
}

.tab{
  border:0;
  background:#e5e7eb;
  padding:12px 4px;
  border-radius:10px;
  font-weight:bold;
  font-size:13px;
}

.tab.active{
  background:#2563eb;
  color:white;
}

.card{
  background:white;
  border-radius:14px;
  padding:15px;
  margin-bottom:12px;
  box-shadow:0 2px 8px rgba(0,0,0,.06);
}

.card h2,
.card h3{
  margin:0 0 12px;
}

label{
  display:block;
  font-size:13px;
  font-weight:bold;
  margin:12px 0 5px;
}

input,
select{
  width:100%;
  border:1px solid #d1d5db;
  border-radius:9px;
  padding:12px;
  font-size:16px;
  background:white;
}

.member-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
}

.member-check{
  display:flex;
  align-items:center;
  gap:7px;
  padding:10px;
  background:#f3f4f6;
  border-radius:9px;
  font-size:14px;
}

.member-check input{
  width:20px;
  height:20px;
}

.btn{
  width:100%;
  border:0;
  border-radius:10px;
  padding:13px;
  margin-top:12px;
  font-size:15px;
  font-weight:bold;
}

.btn.primary{
  background:#2563eb;
  color:white;
}

.btn.green{
  background:#16a34a;
  color:white;
}

.btn.gray{
  background:#e5e7eb;
}

.btn.red{
  background:#dc2626;
  color:white;
}

.btn.small{
  width:auto;
  padding:8px 12px;
  margin:0;
  font-size:13px;
}

.row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
}

.history{
  border-bottom:1px solid #eee;
  padding:12px 0;
}

.history:last-child{
  border-bottom:0;
}

.history-title{
  font-weight:bold;
  font-size:15px;
}

.muted{
  color:#6b7280;
  font-size:13px;
  margin-top:5px;
}

.actions{
  display:flex;
  gap:6px;
  margin-top:8px;
}

.actions button{
  border:0;
  border-radius:7px;
  padding:7px 11px;
  font-size:12px;
  font-weight:bold;
}

.edit{
  background:#dbeafe;
  color:#1d4ed8;
}

.danger{
  background:#fee2e2;
  color:#b91c1c;
}

.summary{
  display:grid;
  grid-template-columns:1fr auto auto;
  gap:8px;
  align-items:center;
  padding:10px 0;
  border-bottom:1px solid #eee;
}

.summary:last-child{
  border-bottom:0;
}

.badge{
  background:#eff6ff;
  color:#1d4ed8;
  border-radius:20px;
  padding:5px 9px;
  font-size:12px;
  white-space:nowrap;
}

.empty{
  text-align:center;
  color:#9ca3af;
  padding:25px 10px;
}

.member-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:11px 0;
  border-bottom:1px solid #eee;
}

.member-row:last-child{
  border-bottom:0;
}

.member-delete{
  border:0;
  background:#fee2e2;
  color:#b91c1c;
  border-radius:7px;
  padding:7px 10px;
  font-size:12px;
}

.notice{
  padding:10px;
  border-radius:9px;
  background:#eff6ff;
  color:#1e40af;
  font-size:12px;
  margin-bottom:10px;
}

.error-box{
  display:none;
  background:#fee2e2;
  color:#991b1b;
  padding:10px;
  border-radius:9px;
  font-size:12px;
  margin-bottom:10px;
  white-space:pre-wrap;
  word-break:break-word;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.5);
  z-index:100;
  padding:15px;
  overflow:auto;
}

.modal-box{
  background:white;
  max-width:600px;
  margin:30px auto;
  border-radius:15px;
  padding:16px;
}

.toast{
  position:fixed;
  left:50%;
  bottom:25px;
  transform:translateX(-50%);
  background:#111827;
  color:white;
  padding:11px 17px;
  border-radius:30px;
  font-size:13px;
  z-index:200;
  display:none;
  max-width:90%;
  text-align:center;
}

.hidden{
  display:none !important;
}

.stat-box{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
}

.stat{
  background:#f3f4f6;
  border-radius:10px;
  padding:12px;
  text-align:center;
}

.stat-number{
  font-size:22px;
  font-weight:bold;
}

.stat-label{
  font-size:11px;
  color:#6b7280;
}
</style>
</head>

<body>

<header>
  <h1>🏀 ミニバス 配車管理 V4</h1>
  <div id="syncStatus" class="sync">
    ☁️ Firebaseに接続しています…
  </div>
</header>

<div class="container">

  <div id="errorBox" class="error-box"></div>

  <div class="tabs">
    <button class="tab active" onclick="showTab('register',this)">配車登録</button>
    <button class="tab" onclick="showTab('summary',this)">団員別集計</button>
    <button class="tab" onclick="showTab('members',this)">団員管理</button>
  </div>

  <!-- ========================= -->
  <!-- 配車登録 -->
  <!-- ========================= -->

  <section id="tab-register">

    <div class="card">
      <h2>🚗 配車を登録</h2>

      <label>日付</label>
      <input type="date" id="date">

      <label>行き先</label>
      <input type="text" id="place" placeholder="例：サンアリーナ">

      <label>走行距離（km）</label>
      <input type="number" id="distance" min="0" step="0.1" placeholder="例：120">

      <label>乗車した団員</label>
      <div id="memberChecks" class="member-grid"></div>

      <button class="btn primary" onclick="addTrip()">
        🚗 選択した団員をまとめて登録
      </button>
    </div>

    <div class="card">
      <h3>登録済みの配車</h3>
      <div id="recent"></div>
    </div>

  </section>

  <!-- ========================= -->
  <!-- 団員別集計 -->
  <!-- ========================= -->

  <section id="tab-summary" class="hidden">

    <div class="card">
      <h2>📊 団員別集計</h2>

      <div class="stat-box">
        <div class="stat">
          <div class="stat-number" id="totalTrips">0</div>
          <div class="stat-label">配車件数</div>
        </div>

        <div class="stat">
          <div class="stat-number" id="totalDistance">0</div>
          <div class="stat-label">総走行距離 km</div>
        </div>
      </div>

      <div id="summaryList" style="margin-top:12px;"></div>
    </div>

    <div class="card">
      <h3>📅 履歴</h3>

      <label>団員を選択</label>
      <select id="historyMember" onchange="renderHistory()">
        <option value="">すべて</option>
      </select>

      <div id="history" style="margin-top:10px;"></div>
    </div>

  </section>

  <!-- ========================= -->
  <!-- 団員管理 -->
  <!-- ========================= -->

  <section id="tab-members" class="hidden">

    <div class="card">
      <h2>👥 団員管理</h2>

      <div class="notice">
        団員を追加・削除できます。変更すると、他の端末にも自動反映されます。
      </div>

      <div class="row">
        <input type="text" id="newMember" placeholder="新しい団員名">
        <button class="btn green small" onclick="addMember()">
          追加
        </button>
      </div>

      <div id="memberList" style="margin-top:12px;"></div>
    </div>

  </section>

</div>

<!-- ========================= -->
<!-- 編集モーダル -->
<!-- ========================= -->

<div id="editModal" class="modal">

  <div class="modal-box">

    <h2>✏️ 配車を編集</h2>

    <input type="hidden" id="editId">

    <label>日付</label>
    <input type="date" id="editDate">

    <label>行き先</label>
    <input type="text" id="editPlace">

    <label>走行距離（km）</label>
    <input type="number" id="editDistance" min="0" step="0.1">

    <label>乗車した団員</label>
    <div id="editChecks" class="member-grid"></div>

    <button class="btn primary" onclick="saveEdit()">
      保存する
    </button>

    <button class="btn gray" onclick="closeEdit()">
      キャンセル
    </button>

  </div>

</div>

<div id="toast" class="toast"></div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/12.1.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore-compat.js"></script>

<script>

/* =========================================================
   Firebase設定
========================================================= */

const firebaseConfig = {
  apiKey: "AIzaSyBRYKiCM_T3gl3dOIGDm5YIqUyJe-5ig8A",
  authDomain: "minibusdanin.firebaseapp.com",
  projectId: "minibusdanin",
  storageBucket: "minibusdanin.firebasestorage.app",
  messagingSenderId: "1093555104011",
  appId: "1:1093555104011:web:13dad177366dd5a9615a0e",
  measurementId: "G-KCNZXML915"
};

firebase.initializeApp(firebaseConfig);

const firestore = firebase.firestore();

const SETTINGS_REF =
  firestore.collection("settings").doc("main");

const TRIPS_REF =
  firestore.collection("trips");


/* =========================================================
   初期団員
========================================================= */

const DEFAULT_MEMBERS = [
  "西濱",
  "小澤",
  "竹内",
  "粉川",
  "山口",
  "藤本",
  "萩",
  "中田",
  "西田",
  "伊丹",
  "高木",
  "鈴木",
  "加藤",
  "舘",
  "長沼"
];


/* =========================================================
   アプリデータ
========================================================= */

let db = {
  members: [],
  trips: []
};


/* =========================================================
   共通
========================================================= */

function $(id){
  return document.getElementById(id);
}

function escapeHtml(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function showToast(message){

  const el = $("toast");

  el.textContent = message;
  el.style.display = "block";

  clearTimeout(window.toastTimer);

  window.toastTimer = setTimeout(()=>{
    el.style.display = "none";
  },2500);
}

function showError(message){

  const box = $("errorBox");

  box.textContent = message;
  box.style.display = "block";
}

function clearError(){

  const box = $("errorBox");

  box.textContent = "";
  box.style.display = "none";
}

function formatDate(date){

  if(!date) return "";

  const p = String(date).split("-");

  if(p.length !== 3) return date;

  return `${p[0]}/${p[1]}/${p[2]}`;
}


/* =========================================================
   タブ
========================================================= */

function showTab(name, button){

  document.querySelectorAll("[id^='tab-']")
    .forEach(el => el.classList.add("hidden"));

  $("tab-" + name).classList.remove("hidden");

  document.querySelectorAll(".tab")
    .forEach(el => el.classList.remove("active"));

  button.classList.add("active");

  renderAll();
}


/* =========================================================
   団員チェックボックス
========================================================= */

function renderMemberChecks(){

  const html = db.members
    .map(name => `
      <label class="member-check">
        <input type="checkbox"
               value="${escapeHtml(name)}">
        <span>${escapeHtml(name)}</span>
      </label>
    `)
    .join("");

  $("memberChecks").innerHTML =
    html || `<div class="empty">団員が登録されていません</div>`;
}

function getSelectedMembers(containerId){

  const container = $(containerId);

  if(!container) return [];

  return Array.from(
    container.querySelectorAll("input[type='checkbox']:checked")
  ).map(input => input.value);
}


/* =========================================================
   配車登録
========================================================= */

async function addTrip(){

  clearError();

  const date =
    $("date").value;

  const place =
    $("place").value.trim();

  const distance =
    Number($("distance").value);

  const members =
    getSelectedMembers("memberChecks");

  if(!date){
    showToast("日付を入力してください");
    return;
  }

  if(!place){
    showToast("行き先を入力してください");
    return;
  }

  if(!(distance > 0)){
    showToast("走行距離を入力してください");
    return;
  }

  if(!members.length){
    showToast("乗車した団員を選択してください");
    return;
  }

  try{

    $("syncStatus").textContent =
      "☁️ Firebaseへ保存しています…";

    const ref =
      await TRIPS_REF.add({

        date: date,

        place: place,

        distance: distance,

        members: members,

        createdAt:
          firebase.firestore.FieldValue.serverTimestamp()

      });

    console.log("登録成功:", ref.id);

    $("place").value = "";
    $("distance").value = "";

    $("memberChecks")
      .querySelectorAll("input")
      .forEach(input => {
        input.checked = false;
      });

    showToast("✅ Firebaseに登録しました");

    $("syncStatus").textContent =
      "☁️ 共有データと同期中";

  }catch(error){

    console.error(error);

    $("syncStatus").textContent =
      "⚠️ Firebase接続エラー";

    showError(
      "配車の保存に失敗しました。\n\n" +
      error.code + "\n" +
      error.message
    );

    showToast("保存できませんでした");
  }
}


/* =========================================================
   配車表示
========================================================= */

function renderRecent(){

  const box = $("recent");

  const trips = [...db.trips]
    .sort((a,b) =>
      String(b.date).localeCompare(String(a.date))
    );

  if(!trips.length){

    box.innerHTML =
      `<div class="empty">まだ配車登録がありません</div>`;

    return;
  }

  box.innerHTML =
    trips.map(trip => {

      const members =
        Array.isArray(trip.members)
          ? trip.members
          : [];

      return `
        <div class="history">

          <div class="history-title">
            ${formatDate(trip.date)}
           　${escapeHtml(trip.place)}
          </div>

          <div class="muted">
            🚗 ${Number(trip.distance)}km
          </div>

          <div class="muted">
            👥 ${members.map(escapeHtml).join("、")}
          </div>

          <div class="actions">

            <button
              class="edit"
              onclick="openEdit('${trip.id}')">
              ✏️ 編集
            </button>

            <button
              class="danger"
              onclick="deleteTrip('${trip.id}')">
              🗑️ 削除
            </button>

          </div>

        </div>
      `;

    }).join("");
}


/* =========================================================
   編集
========================================================= */

function openEdit(id){

  const trip =
    db.trips.find(t => t.id === id);

  if(!trip){

    showToast("データが見つかりません");

    return;
  }

  $("editId").value =
    id;

  $("editDate").value =
    trip.date || "";

  $("editPlace").value =
    trip.place || "";

  $("editDistance").value =
    trip.distance || "";

  const members =
    Array.isArray(trip.members)
      ? trip.members
      : [];

  $("editChecks").innerHTML =
    db.members.map(name => `

      <label class="member-check">

        <input
          type="checkbox"
          value="${escapeHtml(name)}"
          ${members.includes(name) ? "checked" : ""}>

        <span>${escapeHtml(name)}</span>

      </label>

    `).join("");

  $("editModal").style.display =
    "block";
}

function closeEdit(){

  $("editModal").style.display =
    "none";
}

async function saveEdit(){

  const id =
    $("editId").value;

  const date =
    $("editDate").value;

  const place =
    $("editPlace").value.trim();

  const distance =
    Number($("editDistance").value);

  const members =
    getSelectedMembers("editChecks");

  if(!date || !place || !(distance > 0) || !members.length){

    showToast("すべて入力してください");

    return;
  }

  try{

    await TRIPS_REF
      .doc(id)
      .update({

        date: date,

        place: place,

        distance: distance,

        members: members,

        updatedAt:
          firebase.firestore.FieldValue.serverTimestamp()

      });

    closeEdit();

    showToast("✅ 編集内容を保存しました");

  }catch(error){

    console.error(error);

    showError(
      "編集保存エラー\n\n" +
      error.code + "\n" +
      error.message
    );
  }
}


/* =========================================================
   削除
========================================================= */

async function deleteTrip(id){

  const trip =
    db.trips.find(t => t.id === id);

  if(!trip) return;

  const ok =
    confirm(
      `${formatDate(trip.date)} ${trip.place}\n` +
      `この配車を削除しますか？`
    );

  if(!ok) return;

  try{

    await TRIPS_REF
      .doc(id)
      .delete();

    showToast("🗑️ 削除しました");

  }catch(error){

    console.error(error);

    showError(
      "削除エラー\n\n" +
      error.code + "\n" +
      error.message
    );
  }
}


/* =========================================================
   団員別集計
========================================================= */

function renderSummary(){

  const summary = {};

  db.members.forEach(name => {

    summary[name] = {
      count:0,
      distance:0
    };

  });

  db.trips.forEach(trip => {

    const members =
      Array.isArray(trip.members)
        ? trip.members
        : [];

    members.forEach(name => {

      if(!summary[name]){

        summary[name] = {
          count:0,
          distance:0
        };

      }

      summary[name].count += 1;

      summary[name].distance +=
        Number(trip.distance) || 0;

    });

  });

  $("totalTrips").textContent =
    db.trips.length;

  const totalDistance =
    db.trips.reduce(
      (sum,trip) =>
        sum + (Number(trip.distance) || 0),
      0
    );

  $("totalDistance").textContent =
    totalDistance;

  const names =
    Object.keys(summary);

  if(!names.length){

    $("summaryList").innerHTML =
      `<div class="empty">団員が登録されていません</div>`;

    return;
  }

  $("summaryList").innerHTML =
    names.map(name => `

      <div class="summary">

        <div>
          <b>${escapeHtml(name)}</b>
        </div>

        <span class="badge">
          ${summary[name].count}回
        </span>

        <span class="badge">
          ${summary[name].distance}km
        </span>

      </div>

    `).join("");
}


/* =========================================================
   履歴
========================================================= */

function renderHistory(){

  const selected =
    $("historyMember").value;

  let trips =
    [...db.trips]
      .sort((a,b) =>
        String(b.date).localeCompare(String(a.date))
      );

  if(selected){

    trips =
      trips.filter(trip =>
        Array.isArray(trip.members) &&
        trip.members.includes(selected)
      );
  }

  if(!trips.length){

    $("history").innerHTML =
      `<div class="empty">履歴がありません</div>`;

    return;
  }

  $("history").innerHTML =
    trips.map(trip => `

      <div class="history">

        <div class="history-title">
          ${formatDate(trip.date)}
         　${escapeHtml(trip.place)}
        </div>

        <div class="muted">
          ${Number(trip.distance)}km
        </div>

        <div class="muted">
          ${Array.isArray(trip.members)
            ? trip.members.map(escapeHtml).join("、")
            : ""}
        </div>

      </div>

    `).join("");
}

function renderHistoryMemberSelect(){

  const select =
    $("historyMember");

  const current =
    select.value;

  select.innerHTML =
    `<option value="">すべて</option>` +
    db.members.map(name =>
      `<option value="${escapeHtml(name)}">
        ${escapeHtml(name)}
      </option>`
    ).join("");

  if(db.members.includes(current)){

    select.value = current;

  }

}


/* =========================================================
   団員管理
========================================================= */

function renderMemberList(){

  const box =
    $("memberList");

  if(!db.members.length){

    box.innerHTML =
      `<div class="empty">団員がいません</div>`;

    return;
  }

  box.innerHTML =
    db.members.map(name => `

      <div class="member-row">

        <b>${escapeHtml(name)}</b>

        <button
          class="member-delete"
          onclick="deleteMember('${escapeHtml(name)}')">
          削除
        </button>

      </div>

    `).join("");
}

async function addMember(){

  const input =
    $("newMember");

  const name =
    input.value.trim();

  if(!name){

    showToast("団員名を入力してください");

    return;
  }

  if(db.members.includes(name)){

    showToast("その団員はすでに登録されています");

    return;
  }

  try{

    const newMembers =
      [...db.members,name];

    await SETTINGS_REF.set({

      members:newMembers

    },{

      merge:true

    });

    input.value = "";

    showToast("👤 団員を追加しました");

  }catch(error){

    console.error(error);

    showError(
      "団員追加エラー\n\n" +
      error.code + "\n" +
      error.message
    );
  }
}

async function deleteMember(name){

  const ok =
    confirm(
      `${name}さんを団員一覧から削除しますか？`
    );

  if(!ok) return;

  try{

    const newMembers =
      db.members.filter(
        member => member !== name
      );

    await SETTINGS_REF.set({

      members:newMembers

    },{

      merge:true

    });

    showToast("👤 団員を削除しました");

  }catch(error){

    console.error(error);

    showError(
      "団員削除エラー\n\n" +
      error.code + "\n" +
      error.message
    );
  }
}


/* =========================================================
   全画面更新
========================================================= */

function renderAll(){

  renderMemberChecks();

  renderRecent();

  renderSummary();

  renderHistoryMemberSelect();

  renderHistory();

  renderMemberList();
}


/* =========================================================
   Firebase 初期化
========================================================= */

async function initializeData(){

  clearError();

  try{

    $("syncStatus").textContent =
      "☁️ Firebaseに接続しています…";

    const snap =
      await SETTINGS_REF.get();

    if(!snap.exists){

      await SETTINGS_REF.set({

        members: DEFAULT_MEMBERS,

        createdAt:
          firebase.firestore.FieldValue.serverTimestamp()

      });

      db.members =
        [...DEFAULT_MEMBERS];

    }else{

      const data =
        snap.data() || {};

      if(Array.isArray(data.members)){

        db.members =
          data.members;

      }else{

        await SETTINGS_REF.set({

          members: DEFAULT_MEMBERS

        },{

          merge:true

        });

        db.members =
          [...DEFAULT_MEMBERS];
      }

    }

    renderAll();

    $("syncStatus").textContent =
      "☁️ 共有データと同期中";

  }catch(error){

    console.error(error);

    $("syncStatus").textContent =
      "⚠️ Firebase接続エラー";

    showError(
      "Firebaseへの接続に失敗しました。\n\n" +
      error.code + "\n" +
      error.message
    );
  }
}


/* =========================================================
   団員リアルタイム監視
========================================================= */

SETTINGS_REF.onSnapshot(

  snap => {

    if(!snap.exists) return;

    const data =
      snap.data() || {};

    if(Array.isArray(data.members)){

      db.members =
        data.members;

      renderAll();

    }

  },

  error => {

    console.error(error);

    $("syncStatus").textContent =
      "⚠️ Firebase接続エラー";

    showError(
      "団員データの読み込みに失敗しました。\n\n" +
      error.code + "\n" +
      error.message
    );
  }

);


/* =========================================================
   配車リアルタイム監視
========================================================= */

TRIPS_REF.onSnapshot(

  snap => {

    db.trips =
      snap.docs
        .map(doc => ({

          id:doc.id,

          ...doc.data()

        }))
        .filter(trip =>
          trip.date &&
          trip.place &&
          Number(trip.distance) > 0 &&
          Array.isArray(trip.members)
        );

    renderAll();

    $("syncStatus").textContent =
      "☁️ 共有データと同期中";

    clearError();

  },

  error => {

    console.error(error);

    $("syncStatus").textContent =
      "⚠️ Firebase接続エラー";

    showError(
      "配車データの読み込みに失敗しました。\n\n" +
      error.code + "\n" +
      error.message
    );
  }

);


/* =========================================================
   起動
========================================================= */

document.addEventListener(
  "DOMContentLoaded",
  () => {

    const today =
      new Date();

    const yyyy =
      today.getFullYear();

    const mm =
      String(today.getMonth()+1)
      .padStart(2,"0");

    const dd =
      String(today.getDate())
      .padStart(2,"0");

    $("date").value =
      `${yyyy}-${mm}-${dd}`;

    initializeData();

  }
);

</script>
