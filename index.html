<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ミニバス乗車管理</title>

  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
      max-width: 500px;
      margin: auto;
    }

    input, button {
      font-size: 18px;
      padding: 12px;
      margin: 6px 0;
      width: 100%;
      box-sizing: border-box;
    }

    button {
      cursor: pointer;
    }

    #status {
      margin-top: 15px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <h2>🏀 ミニバス乗車管理</h2>

<select id="memberName">
  <option value="">メンバーを選択</option>
  <option value="西濱">西濱</option>
  <option value="小澤">小澤</option>
  <option value="竹内">竹内</option>
  <option value="粉川">粉川</option>
  <option value="山口">山口</option>
  <option value="藤本">藤本</option>
  <option value="萩">萩</option>
  <option value="中田">中田</option>
  <option value="西田">西田</option>
  <option value="伊丹">伊丹</option>
  <option value="高木">高木</option>
  <option value="鈴木">鈴木</option>
  <option value="加藤">加藤</option>
  <option value="長沼">長沼</option>
  <option value="舘">舘</option>
</select>

<button id="saveButton">
  🚐 乗車登録
</button>

  <p id="status">Firebase接続確認中……</p>


<script type="module">

import { initializeApp } from
  "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

import {
  initializeFirestore,
  collection,
  addDoc,
  serverTimestamp
} from
  "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


const firebaseConfig = {
  apiKey: "AIzaSyBRYKiCM_T3gl3dOIGDm5YIqUyJe-5ig8A",
  authDomain: "minibusdanin.firebaseapp.com",
  projectId: "minibusdanin",
  storageBucket: "minibusdanin.firebasestorage.app",
  messagingSenderId: "1093555104011",
  appId: "1:1093555104011:web:935cef97dd4bfee8615a0e",
  measurementId: "G-XFSJQRLHQ2"
};


const app = initializeApp(firebaseConfig);

const db = initializeFirestore(app, {}, "default");


const status = document.getElementById("status");
const memberName = document.getElementById("memberName");
const saveButton = document.getElementById("saveButton");


saveButton.addEventListener("click", async () => {

  const name = memberName.value.trim();

  if (!name) {
    status.textContent = "⚠️ 名前を入力してください。";
    return;
  }

  try {

    await addDoc(
      collection(db, "trips"),
      {
        memberName: name,
        createdAt: serverTimestamp()
      }
    );

    status.textContent =
      "✅ " + name + " さんの乗車記録を保存しました！";

    memberName.value = "";

  } catch (error) {

    console.error(error);

    status.textContent =
      "❌ 保存失敗: " +
      error.code +
      " / " +
      error.message;

  }

});

</script>

</body>
</html>
